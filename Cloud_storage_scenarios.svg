  <text x="955" y="443" text-anchor="middle" class="boxText">Play stream</text>
  <text x="955" y="458" text-anchor="middle" class="boxText">FastServe</text>
  <text x="955" y="473" text-anchor="middle" class="boxText">Arkiv</text>

