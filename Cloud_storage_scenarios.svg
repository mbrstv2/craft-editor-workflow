  <text x="275" y="608" text-anchor="middle" class="boxText">S3 proxy</text>
  <text x="275" y="623" text-anchor="middle" class="boxText">Low-bitrate</text>
  <text x="275" y="638" text-anchor="middle" class="boxText">5-10 mbs</text>
  <text x="275" y="653" text-anchor="middle" class="boxText">Temp cache</text>

  <!-- Step 3 -->
  <rect class="stepBox boxBlue" x="380" y="570" width="130" height="100" rx="8" ry="8"/>
  <text x="445" y="590" text-anchor="middle" class="boxTitle">S3 Storage</text>
  <text x="445" y="608" text-anchor="middle" class="boxText">Proxy files</text>
  <text x="445" y="623" text-anchor="middle" class="boxText">Low bitrate</text>
  <text x="445" y="638" text-anchor="middle" class="boxText">Metadata</text>
  <text x="445" y="653" text-anchor="middle" class="boxText">Standard storage</text>

  <!-- Step 4 -->
  <rect class="stepBox" x="550" y="570" width="130" height="100" rx="8" ry="8"/>
  <text x="615" y="590" text-anchor="middle" class="boxTitle">Easy Edit</text>
  <text x="615" y="608" text-anchor="middle" class="boxText">Proxy editing</text>
  <text x="615" y="623" text-anchor="middle" class="boxText">Low-resolution</text>
