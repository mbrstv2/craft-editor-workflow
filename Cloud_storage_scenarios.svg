  <text x="615" y="248" text-anchor="middle" class="boxText">PAM integration</text>
  <text x="615" y="263" text-anchor="middle" class="boxText">Metadata</text>
  <text x="615" y="278" text-anchor="middle" class="boxText">Story-link</text>
  <text x="615" y="293" text-anchor="middle" class="boxText">Online S3</text>

