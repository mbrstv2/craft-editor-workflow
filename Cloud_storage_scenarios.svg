  <text x="105" y="263" text-anchor="middle" class="boxText">X-kanaler</text>
  <text x="105" y="278" text-anchor="middle" class="boxText">Real-time</text>
  <text x="105" y="293" text-anchor="middle" class="boxText">High-bitrate</text>

