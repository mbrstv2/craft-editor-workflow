  <text x="445" y="458" text-anchor="middle" class="boxText">Mediciner + metier</text>
  <text x="445" y="473" text-anchor="middle" class="boxText">Standard storage</text>

  <!-- Step 4 -->
  <rect class="stepBox boxOrange" x="550" y="390" width="130" height="100" rx="8" ry="8"/>
  <text x="615" y="410" text-anchor="middle" class="boxTitle">Craft Edit</text>
  <text x="615" y="428" text-anchor="middle" class="boxText">Scrub + 4 spor</text>
  <text x="615" y="443" text-anchor="middle" class="boxText">Growing files</text>
  <text x="615" y="458" text-anchor="middle" class="boxText">15-50 TB/dag</text>
