  <text x="50" y="755" class="boxText">Scenario 1 (Grøn): MCR Live – Real-time capture og transcode, S3 cloud storage med lokal cache</text>
  <text x="50" y="775" class="boxText">Scenario 2 (Orange): High-Performance – Craft editing med 15% growing files, intense compute, >100 MB/s throughput</text>
  <text x="50" y="795" class="boxText">Scenario 3 (Blå): Fil-Ingest – Batch-baseret import, low-bitrate proxies, web-first workflow</text>
  <text x="50" y="820" class="boxText">Fælles: Alle scenarier bruger S3 som persistenslag, lokal cache for performance, PAM for metadata/organisering</text>

</svg>