  <text x="105" y="443" text-anchor="middle" class="boxText">0.5 TB/dag</text>
  <text x="105" y="458" text-anchor="middle" class="boxText">60 timer</text>
  <text x="105" y="473" text-anchor="middle" class="boxText">High-bitrate</text>

