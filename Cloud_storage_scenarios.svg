  <text x="785" y="248" text-anchor="middle" class="boxText">12 TB/dag</text>
  <text x="785" y="263" text-anchor="middle" class="boxText">200 GB/dag</text>
  <text x="785" y="278" text-anchor="middle" class="boxText">Master + QC</text>
  <text x="785" y="293" text-anchor="middle" class="boxText">Online storage</text>

