<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cloud storage med lokal cache - 3 scenarier 2030</title>
  <desc id="desc">Cloud storage architecture with local cache scenarios for MCR and Studier Øverste</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .stepHeaderBox { fill: #1e293b; stroke: none; }
      .stepHeaderText { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .stepBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .boxTitle { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowHead); }
      .scenarioLabel { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .boxGreen { fill: #dcfce7; stroke: #86efac; stroke-width: 1.5; }
      .boxBlue { fill: #dbeafe; stroke: #7dd3fc; stroke-width: 1.5; }
      .boxOrange { fill: #fed7aa; stroke: #fb923c; stroke-width: 1.5; }
      .boxYellow { fill: #fef08a; stroke: #facc15; stroke-width: 1.5; }
    </style>

    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" class="bg"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" class="title">Cloud storage med lokal cache</text>
  <text x="700" y="65" text-anchor="middle" class="subtitle">Scenarie B 2030 - Hybrid cloud infrastructure med S3, PAM og Rendering</text>

  <!-- Step Headers -->
  <rect class="stepHeaderBox" x="40" y="85" width="140" height="40" rx="6" ry="6"/>
  <text x="110" y="112" text-anchor="middle" class="stepHeaderText">1. Live Ingest</text>

  <rect class="stepHeaderBox" x="210" y="85" width="140" height="40" rx="6" ry="6"/>
  <text x="280" y="112" text-anchor="middle" class="stepHeaderText">2. Convert/Cache</text>

  <rect class="stepHeaderBox" x="380" y="85" width="140" height="40" rx="6" ry="6"/>
  <text x="450" y="112" text-anchor="middle" class="stepHeaderText">3. PAM/Storage</text>

